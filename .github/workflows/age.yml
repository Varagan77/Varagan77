name: Update Hex Age Badge

on:
  schedule: # Recompute once a day so the countdown/age stays current
    - cron: "5 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_age.py"
      - ".github/workflows/age.yml"

jobs:
  update-age:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate age-hex-{dark,light}.svg
        run: python3 scripts/generate_age.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update hex age badge"
          file_pattern: "generated/age-hex-*.svg"
