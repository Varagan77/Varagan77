name: Update Profile Card

on:
  schedule:
    - cron: "5 0 * * *"   # once a day so age / stats / activity stay current
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_profile.py"
      - ".github/workflows/profile.yml"

jobs:
  update-profile:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate generated/profile-{dark,light}.svg
        env:
          # PROFILE_TOKEN: a classic PAT with `read:user` + `public_repo` scopes,
          # added under Settings -> Secrets and variables -> Actions.
          # Falls back to GITHUB_TOKEN, which can only see this one repo and
          # will report all stats as 0.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile.py

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile card"
          file_pattern: "generated/profile-*.svg"
