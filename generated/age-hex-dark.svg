<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="460px" height="102px" font-size="13px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
.border { fill: none; stroke: #30363d; stroke-width: 1; }
.title { fill: #3fb950; font-weight: bold; }
.key { fill: #ffa657; }
.value { fill: #a5d6ff; }
.dim { fill: #30363d; }
text, tspan { white-space: pre; }
</style>
<rect class="border" x="0.5" y="0.5" width="459" height="101" rx="6" ry="6"/>
